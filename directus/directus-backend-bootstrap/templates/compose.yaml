services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-directus}
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  directus:
    build: .
    ports:
      - "127.0.0.1:${DIRECTUS_PORT:-8055}:8055"
    depends_on:
      database:
        condition: service_healthy
    environment:
      CMS_ENV: ${CMS_ENV:-dev}
      SECRET: ${SECRET:?Set SECRET in your environment or .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in your environment or .env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your environment or .env file}
      # Static token for the default admin user, assigned on `bootstrap`
      # (first start / after a volume wipe). Keeping this fixed means
      # frontends' DIRECTUS_READ_TOKEN never has to be regenerated after
      # `make reseed` — see README.md.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in your environment or .env file}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
    volumes:
      - uploads:/directus/uploads
      - schema-state:/directus/schema-state
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  database:
  uploads:
  schema-state:
