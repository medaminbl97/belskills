name: Smoke test

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A unique project name keeps parallel runs on one runner apart. It is a
      # disposable stack, so `down -v` below only ever touches this project.
      COMPOSE_PROJECT_NAME: cms-smoke-${{ github.run_id }}
      CMS_ENV: dev
    # In a monorepo, run in the folder that holds the CMS and fix the paths:
    #   defaults: { run: { working-directory: cms } }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Unit tests
        run: |
          npm ci
          npm test

      # Random throwaway credentials for this run only.
      - name: Generate credentials
        run: node tools/init-env.mjs >/dev/null

      - name: Validate the Compose file
        run: docker compose --env-file .env config --quiet

      - name: Start the backend
        run: docker compose --env-file .env up --build -d --wait --wait-timeout 300 database directus

      - name: Smoke test
        run: |
          set -a; . ./.env; set +a
          scripts/smoke-test.sh

      # Fails when schemas/ changed without a new revision in revisions/.
      - name: Revisions match the YAML
        run: PROJECT="$COMPOSE_PROJECT_NAME" tools/revisions-cli.sh check

      - name: Live verification
        run: |
          set -a; . ./.env; set +a
          DIRECTUS_URL="http://127.0.0.1:${DIRECTUS_PORT}" node tools/verify.mjs

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color --tail 200

      - name: Stop the backend
        if: always()
        run: docker compose --env-file .env down -v
