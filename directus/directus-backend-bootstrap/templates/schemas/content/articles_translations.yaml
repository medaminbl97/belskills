collection: articles_translations
schema: {}
meta:
  icon: article
  accountability: all
  hidden: true
fields:
  - field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: input
      special:
        - uuid
      hidden: true
  - field: parent
    type: uuid
    schema:
      is_nullable: false
    meta:
      interface: select-dropdown-m2o
      special:
        - m2o
  - field: language
    type: string
    schema:
      is_nullable: false
    meta:
      interface: select-dropdown-m2o
      special:
        - m2o
  - field: title
    type: string
    schema:
      is_nullable: false
    meta:
      interface: input
  # Rich text is stored as HTML in a text field; clients must sanitize it.
  - field: body
    type: text
    schema:
      is_nullable: true
    meta:
      interface: input-rich-text-html
      note: Uniqueness per language is not enforced by the schema.
relations:
  - field: parent
    related_collection: articles
    schema:
      on_delete: CASCADE
    meta:
      one_field: translations
      junction_field: language
  - field: language
    related_collection: languages
    schema:
      on_delete: RESTRICT
    meta:
      one_field: null
      junction_field: parent
