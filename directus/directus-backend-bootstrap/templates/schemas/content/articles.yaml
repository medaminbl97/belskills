collection: articles
schema: {}
meta:
  icon: newspaper
  accountability: all
fields:
  - field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: input
      special:
        - uuid
      hidden: true
  - field: slug
    type: string
    schema:
      is_nullable: false
      is_unique: true
    meta:
      interface: input
      validation:
        slug:
          _regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
  - field: status
    type: string
    schema:
      is_nullable: false
      default_value: draft
    meta:
      interface: select-dropdown
      options:
        choices:
          - text: draft
            value: draft
          - text: published
            value: published
          - text: archived
            value: archived
      validation:
        status:
          _in:
            - draft
            - published
            - archived
  # Money is stored as exact decimals in euros, never as float/double, and never
  # as integer cents. Directus returns it as a string such as "12.50".
  - field: price
    type: decimal
    schema:
      is_nullable: false
      default_value: 0
      numeric_precision: 12
      numeric_scale: 2
    meta:
      interface: input
      note: Amount in euros (EUR) with two decimal places.
      options:
        min: 0
        step: 0.01
      validation:
        price:
          _gte: 0
  - field: published_at
    type: timestamp
    meta:
      interface: datetime
      note: Optional start of visibility; empty means immediately when published.
  - field: expires_at
    type: timestamp
    meta:
      interface: datetime
      note: Optional end of visibility; empty means no expiry.
  - field: thumbnail
    type: uuid
    schema:
      is_nullable: true
    meta:
      interface: file-image
      special:
        - file
  - field: translations
    type: alias
    schema: null
    meta:
      special:
        - translations
      interface: translations
      options:
        languageField: name
        defaultLanguage: en
relations:
  - field: thumbnail
    related_collection: directus_files
    schema:
      foreign_key_column: id
      on_delete: SET NULL
    meta: {}
