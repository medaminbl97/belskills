# Managed read-only policies, one per consuming application. Each policy gets a
# keyless service user; generate a static token for it in the Directus admin
# (tokens are NOT managed here). IDs must be unique, stable UUIDs: generate with
# `uuidgen` and never reuse another project's IDs.
#
# `folder` is optional; define it only if a policy grants access to files.
# folder: { id: <uuid>, name: Approved website assets }
policies: []
